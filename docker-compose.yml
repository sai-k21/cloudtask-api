version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudtask-postgres
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: cloudtask
      POSTGRES_PASSWORD: cloudtask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtask"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cloudtask-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudtask
      DB_USER: cloudtask
      DB_PASSWORD: cloudtask
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
